startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      vatnodeApiKey:
        type: string
        description: vatnode API key (free tier at https://vatnode.dev). Required only for the validate_vat_number tool; the offline rates, format-check and country-list tools work without it.
  commandFunction:
    |-
    (config) => ({ command: 'npx', args: ['-y', 'vatnode-mcp'], env: config.vatnodeApiKey ? { VATNODE_API_KEY: config.vatnodeApiKey } : {} })
