name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm via Trusted Publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships with npm >= 11, required for Trusted Publishing OIDC
          # to authenticate the registry PUT (not just provenance signing).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Publish to npm
        # Skips the publish when this version is already on the registry, so the
        # workflow can be re-run to finish a release whose MCP Registry step failed.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "vatnode-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "vatnode-mcp@$VERSION already published, skipping npm publish"
          else
            npm publish --provenance --access public
          fi

      # Publish to the official MCP Registry (registry.modelcontextprotocol.io).
      # Uses GitHub OIDC — no secret needed; id-token: write is already granted
      # above. The io.github.vatnode/* namespace is authorized by the OIDC token's
      # repository owner (vatnode). server.json version must match the npm version.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      # The MCP Registry re-checks npm for the version in server.json, and a
      # freshly published tarball takes a moment to become resolvable there.
      # Without this wait the step fails with a 404 on a release that is fine.
      - name: Wait for npm to serve the new version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if npm view "vatnode-mcp@$VERSION" version >/dev/null 2>&1; then
              echo "vatnode-mcp@$VERSION is resolvable"
              exit 0
            fi
            echo "attempt $i: not yet on registry, waiting"
            sleep 10
          done
          echo "vatnode-mcp@$VERSION never became resolvable" >&2
          exit 1
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
